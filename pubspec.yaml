name: craftconnect
description: CraftConnect - Digital Storefront for Local Artisans
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.4
  firebase_analytics: ^11.3.4
  
  # State Management
  provider: ^6.1.1
  
  # UI & Navigation
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^13.0.0
  flutter_carousel_widget: ^2.0.0
  
  # Image Handling
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  # Utilities
  uuid: ^4.3.3
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  app_links: ^6.3.2
  shared_preferences: ^2.2.2
  
  # Icons & Fonts
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  
  # Loading & Dialogs
  flutter_spinkit: ^5.2.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  generate: true
