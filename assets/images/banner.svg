<!-- This is a placeholder for banner.png -->
<!-- In a real project, you would place an actual PNG image file here -->
<!-- For now creating a simple SVG that can be used as banner -->
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="craftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4735E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4A261;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#craftGradient)" />
  
  <!-- Title -->
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="white" stroke="#3D2E2E" stroke-width="1">
    CraftConnect
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="24" 
        text-anchor="middle" fill="white" opacity="0.9">
    Digital Storefront for Local Artisans
  </text>
  
  <!-- Tagline -->
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="16" 
        text-anchor="middle" fill="white" opacity="0.8" font-style="italic">
    One app. One link. One business.
  </text>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="40" fill="white" opacity="0.2" />
  <circle cx="650" cy="320" r="60" fill="white" opacity="0.15" />
  <circle cx="700" cy="80" r="30" fill="white" opacity="0.1" />
</svg>