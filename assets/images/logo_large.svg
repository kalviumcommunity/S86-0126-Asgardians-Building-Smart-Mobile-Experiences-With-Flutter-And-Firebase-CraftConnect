<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#6366F1" stroke="#4F46E5" stroke-width="20"/>
  
  <!-- Inner Circle for better contrast -->
  <circle cx="256" cy="256" r="180" fill="#FFFFFF" fill-opacity="0.1"/>
  
  <!-- Craft Symbol - Hammer and Wrench -->
  <g transform="translate(256, 256)">
    <!-- Hammer -->
    <g transform="rotate(-30)">
      <rect x="-8" y="-100" width="16" height="120" fill="#FFFFFF" rx="4"/>
      <rect x="-30" y="-110" width="60" height="25" rx="8" fill="#FFFFFF"/>
      <rect x="-25" y="-108" width="50" height="21" rx="6" fill="#4F46E5"/>
    </g>
    
    <!-- Wrench -->
    <g transform="rotate(30)">
      <rect x="-6" y="-90" width="12" height="100" fill="#FFFFFF" rx="4"/>
      <circle cx="0" cy="-90" r="20" fill="none" stroke="#FFFFFF" stroke-width="8"/>
      <circle cx="0" cy="-90" r="12" fill="#4F46E5"/>
      <rect x="-15" y="10" width="30" height="15" fill="#FFFFFF" rx="4"/>
    </g>
    
    <!-- Central connection point -->
    <circle cx="0" cy="0" r="12" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="8" fill="#6366F1"/>
  </g>
  
  <!-- Bottom text area -->
  <rect x="50" y="400" width="412" height="80" fill="#FFFFFF" fill-opacity="0.15" rx="20"/>
  
  <!-- App Name -->
  <text x="256" y="440" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="bold">CraftConnect</text>
  <text x="256" y="465" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="300">Connect • Create • Craft</text>
</svg>