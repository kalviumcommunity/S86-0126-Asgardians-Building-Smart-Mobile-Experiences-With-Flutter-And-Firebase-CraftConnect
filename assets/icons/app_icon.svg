<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#6366F1" rx="180"/>
  
  <!-- Craft Symbol - Hammer and Wrench -->
  <g transform="translate(512, 512)">
    <!-- Hammer -->
    <g transform="rotate(-30)">
      <rect x="-20" y="-200" width="40" height="240" fill="#FFFFFF" rx="10"/>
      <rect x="-60" y="-220" width="120" height="50" rx="15" fill="#FFFFFF"/>
      <rect x="-50" y="-215" width="100" height="40" rx="12" fill="#4F46E5"/>
    </g>
    
    <!-- Wrench -->
    <g transform="rotate(30)">
      <rect x="-15" y="-180" width="30" height="200" fill="#FFFFFF" rx="10"/>
      <circle cx="0" cy="-180" r="40" fill="none" stroke="#FFFFFF" stroke-width="20"/>
      <circle cx="0" cy="-180" r="25" fill="#4F46E5"/>
      <rect x="-30" y="20" width="60" height="30" fill="#FFFFFF" rx="8"/>
    </g>
    
    <!-- Central connection -->
    <circle cx="0" cy="0" r="25" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="18" fill="#6366F1"/>
  </g>
</svg>