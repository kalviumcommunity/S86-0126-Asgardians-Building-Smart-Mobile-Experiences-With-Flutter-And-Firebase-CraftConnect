org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Kotlin configuration - DISABLED incremental compilation to fix path issues
kotlin.incremental=false
kotlin.caching.enabled=false
kotlin.compiler.execution.strategy=in-process

# Gradle performance options - Modified for stability with spaces in path
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.workers.max=4

# Android build optimization
android.enableR8.fullMode=false
android.enableD8=true
